services:
  api:
    build: .
    container_name: atlanta-uhi-api
    command: uvicorn api:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./inference.log:/app/inference.log

  frontend:
    build: .
    container_name: atlanta-uhi-frontend
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      - API_URL=http://api:8080
    ports:
      - "8501:8501"
    depends_on:
      - api